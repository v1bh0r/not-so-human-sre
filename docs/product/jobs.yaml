# PRIMARY JOB

primary_job:
  id: J-PRIMARY
  level: strategic
  statement: >
    When a production alert fires during an active incident, I want to immediately understand
    what is failing, where it is failing, and why it is failing, so I can begin targeted
    mitigation instead of investigation.
  abstraction_level: strategic
  validated_by: DISCOVER wave — 10/10 interviews confirmed; 8/10 resonated with ghost-in-the-chair framing
  disruption_risk: LOW at 3-year horizon (full autonomous remediation is not trusted; see INV-02)

