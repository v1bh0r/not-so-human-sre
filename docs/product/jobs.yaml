# CONSTRAINTS

constraints:
  - id: C-01
    statement: Autonomous execution must be opt-in, reversible, and audit-logged
    source: DISCOVER trust evidence (A-06, I-02, I-06)
    impact: Architecture must include action log and rollback mechanism; recommendation mode is default

  - id: C-02
    statement: Agent must degrade gracefully on incomplete OTel instrumentation
    source: DISCOVER signal gap finding (A-08, I-01)
    impact: No assumption of 100% trace coverage; "signal gap detected" is an explicit output state

  - id: C-03
    statement: Runbooks cannot be treated as executable ground truth
    source: DISCOVER runbook maturity evidence (A-03, REF-006)
    impact: Each runbook step must be validated against current system state; runbooks are heuristic guidance

  - id: C-04
    statement: Agent output must be explainable at the hypothesis level
    source: DISCOVER trust evidence (I-02: "If it can't show me why, I don't trust it")
    impact: Every hypothesis must cite the specific signals that support it

  - id: C-05
    statement: Filesystem runbook format must support Markdown (Git-resident) as primary format
    source: DISCOVER REF-006 — 6/10 orgs use Markdown-in-Git
    impact: Parser must handle Markdown; secondary formats (Confluence export) are v2

  - id: C-06
    statement: Primary persona is on-call SRE during live incident, not post-mortem analyst
    source: DISCOVER opportunity scoring (F-01 through F-04 outscored F-05)
    impact: Post-mortem automation is deprioritized until live-incident core is validated

